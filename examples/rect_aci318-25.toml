# ==============================================================================
#  biaxnm 입력 파일 (전체 옵션 안내)  -  400 x 600 직사각형 RC 기둥, ACI 318-25
# ==============================================================================
#  실행:  biaxnm examples/rect_aci318-25.toml
#         biaxnm examples/rect_aci318-25.toml --out 결과폴더      (저장 위치 변경)
#         biaxnm examples/rect_aci318-25.toml --no-save           (출력만, 파일 저장 안 함)
#
#  단위
#    길이 mm / 면적 mm^2 / 응력, 탄성계수 MPa / 변형률 무차원 (mm/mm)
#    각도 deg (도)
#    하중   [loads] 안의 Pu 는 kN, Mux 와 Muy 는 kN*m   <- 하중만 kN, kN*m 이다
#    부호   축력은 압축이 양(+), 인장이 음(-)
#           Mux 는 x축 둘레, Muy 는 y축 둘레 모멘트이고 방향은 atan2(Muy, Mux)
#    좌표   전역 (x, y), 단위 mm. 모든 좌표는 같은 원점을 쓴다.
#
#  표(table) 구성:  [code]  [section]  [analysis]  [loads.이름]  [output]
#  이 파일에 없는 키를 쓰면 오류로 알려준다 (오타 방지).
#  파일 안의 상대 경로(csv, output.dir)는 이 파일이 있는 폴더 기준이다.
# ==============================================================================


# ------------------------------------------------------------------------------
#  [code]  설계기준  (필수)
# ------------------------------------------------------------------------------
#  type 선택지:  "aci318-25"  |  "kds14-22"  |  "kds14-22-app"  |  "kds24-25"  |  "ec2-04-1-1"  |  "ec2-05-2"  |  "custom"
#     "aci318-25"    ACI 318-25
#     "kds14-22"     KDS 14 20 20:2022 강도설계법 (강도감소계수 phi). KDS 24 14 20 (교량 극한강도설계법) 도 같다
#     "kds14-22-app" KDS 14 20 20:2022 부록, 재료계수를 적용한 설계
#     "kds24-25"     KDS 24 14 21 (교량 한계상태설계법), 재료계수 적용
#     "ec2-04-1-1"   EN 1992-1-1:2004 (Eurocode 2 건축, 1세대) + National Annex, 재료계수 적용
#     "ec2-05-2"     EN 1992-2:2005 (Eurocode 2 교량, 1세대) + National Annex, 재료계수 적용
#  다른 설계기준은 type 과 그 설계기준의 키만 다르다 (키는 아래 요약). 예제: kds14-22 = circle_kds14-22.toml, kds14-22-app = hollow_kds14-22-app.toml,
#  kds24-25 = phc_kds24-25.toml, ec2-04-1-1 = src_ec2-04-1-1.toml, ec2-05-2 = track_ec2-05-2.toml.
[code]
type = "aci318-25"

# --- type = "aci318-25" 일 때 쓸 수 있는 키 ------------------------------------
fc = 30                  # 필수. 콘크리트 압축강도 [MPa]
fy = 420                 # 필수. 철근 항복강도 [MPa]
# Es = 200000            # 철근 탄성계수 [MPa]               (기본 200000)
# Fy = 355               # 형강 항복강도 [MPa]  - 형강(steel)이 있으면 필수
# Es_steel = 200000      # 형강 탄성계수 [MPa]               (기본 200000)
# fpy = 1275             # 긴장재 항복강도 [MPa] - 긴장재(tendons)가 있으면 필수
# Ep = 195000            # 긴장재 탄성계수 [MPa]             (기본 195000)
transverse = "tied"      # 횡철근 형식:  "tied"(띠철근, phi_c=0.65) | "spiral"(나선철근, phi_c=0.75)
# phi_strain = "all"     # phi 를 정하는 인장변형률 εt 의 기준
                         #   "all"   : 철근, 형강, 긴장재 중 가장 많이 늘어난 것 (기본)
                         #   "rebar" : 철근만 (철근이 없으면 "all" 로 처리)
# eps_cu = 0.003         # 극한 압축변형률                   (기본 0.003)
# gamma_c = 1.0          # 콘크리트 재료계수 (강도를 이 값으로 나눔)   (기본 1.0)
# gamma_s = 1.0          # 철근, 형강, 긴장재 재료계수               (기본 1.0)
                         # ACI 318-25 (type = "aci318-25") 는 phi 에 상한을 둔다 (21.2.2.3):
                         #   0.1*fc*Ag <= Pn <= Pn,bal 구간에서 phi 는 (Pn=0.1*fc*Ag 에서 0.90, Pn=Pn,bal 에서 phi_c)
                         #   를 잇는 직선을 넘을 수 없다. Pn,bal 은 인장변형률 εt 가 항복변형률에 이르는 점의 Pn 이다.
                         #   (원문은 비긴장재 부재에만 적용하지만, 긴장재가 있는 단면에도 보수적으로 적용한다)

# --- type = "kds14-22" 일 때 쓸 수 있는 키 (fc 대신 fck 를 쓴다) --------------------
#  fck [MPa, 90 이하], fy, Es, Fy, Es_steel, fpy, Ep : 위와 같다 (fck, fy 필수)
#  transverse   = "tied" (phi_c=0.65) | "spiral" (phi_c=0.70)
#  stress_block = "rectangular" (기본, 등가 직사각형 블록 4.1.1(8)) | "parabola" (포물선-직선 곡선 4.1.1(7))
#  phi_max      = 0.75 같은 phi 상한 (프리텐션 부재 끝부분 단면을 보수적으로 검토, KDS 14 20 10 4.2.3(2))
#  phi 는 철근의 순인장변형률 εt 로 정한다 (긴장재가 있으면 최외단 긴장재). 인장지배 0.85, 압축지배 0.65/0.70.
#  εcu, η, β1 은 fck 에서 정해진다 (εcu = 0.0033, 40 MPa 초과 시 10 MPa 마다 0.0001 감소).
#
# --- type = "kds14-22-app" 또는 "kds24-25" 일 때 쓸 수 있는 키 ---------------------
#  fck, fy, Es, Fy, Es_steel, fpy, Ep : 위와 같다 (fck, fy 필수)
#  phi_c = 0.65 : 콘크리트 재료계수 (극한하중조합. 극단상황, 사용, 피로 조합은 1.0)
#  phi_s = 0.90 : 철근, 형강, 긴장재 재료계수 (같은 조합에서 1.0)
#  "kds14-22-app" 만:  stress_block = "rectangular"(기본, 등가 직사각형 블록 4.1.1(8)) | "parabola"(4.1.1(7))
#                      철근 응력 = phi_s * min(Es*ε, fy)  (곡선 해석)
#                      설계축강도 Pdo 는 부록 3.2(1)의 식 (3-2), (3-3)으로 따로 계산해 상한으로 쓴다 (Pnd <= Pdo).
#                      긴장재가 있는 단면은 식이 없으므로 해석의 순수압축 값을 쓴다.
#  "kds24-25" 만:      combination = "ultimate"(기본, 0.65/0.90) | "extreme" | "service" | "fatigue"(1.0/1.0)
#                      phi_c, phi_s 를 직접 주면 combination 값을 덮어쓴다 (품질관리 충분 시 증가 계수 등)
#                      콘크리트는 포물선-직선 곡선만, 철근 응력 = min(Es*ε, phi_s*fy), fy 는 600 MPa 이하
#  콘크리트는 최대 응력 0.85*phi_c*fck 로 해석하고 결과를 그대로 설계강도로 쓴다.
#  (phi 를 다시 곱하지 않고, 최대 축강도 0.80/0.85 상한과 최소 편심은 적용하지 않는다)

# --- type = "ec2-04-1-1" (EN 1992-1-1:2004) 또는 "ec2-05-2" (EN 1992-2:2005) 일 때 쓸 수 있는 키 ----
#  두 type 은 해석이 같고 National Annex 값(alpha_cc, fck 범위, 철근 등급)이 다르다.
#  fck [MPa], fy [MPa, NA 상한 이하], Es, Fy, Es_steel, fpy, Ep : 위와 같다 (fck, fy 필수)
#     fpy 는 fp0.1k 로 읽고 gamma_s 로 나눈다. Fy 는 gamma_a (기본 1.0) 로 나눈다.
#     fck 범위: ec2-04-1-1 은 12 ~ 90, ec2-05-2 는 EN 30 ~ 70 (UK 25 ~ 70, FR/CZ 20 ~ 90, ES 25 ~ 90)
#  na = "EN"(기본, 권장값) | "UK" | "DE" | "FR" | "ES" | "custom"   (ec2-05-2 는 "DE" 대신 "CZ")
#       ec2-04-1-1: EN 1.5 / 1.15 / alpha_cc 1.0, UK alpha_cc 0.85, DE alpha_cc 0.85 (우발 gamma_c 1.3, fy <= 500,
#                   eps_ud 0.025), FR fy <= 500, ES (우발 gamma_c 1.3, fy <= 500)
#       ec2-05-2:   EN alpha_cc 0.85 (EN 1992-2 3.1.6(101)P), UK 0.85, FR 1.0, ES 1.0, CZ 0.90.
#                   gamma_c, gamma_s, fy 상한은 EN 1992-1-1 의 같은 나라 NA 값
#       Scia 의 NA 요약 자료 기준이므로 NA 원문과 대조할 것.
#       "custom" 은 gamma_c, gamma_s, alpha_cc 를 모두 직접 줘야 한다.
#  situation = "persistent"(기본, 지속/일시) | "accidental"
#  gamma_c, gamma_s, alpha_cc : NA 값을 직접 덮어쓴다 (alpha_cc 는 0.8 ~ 1.0)
#  stress_block = "parabola"(기본, 포물선-직선 3.1.7(1)) | "rectangular"(등가 직사각형 3.1.7(3))
#  steel_branch = "horizontal"(기본, 변형률 제한 없음) | "inclined"(경사 가지, 변형률 한계 eps_ud, pivot A)
#  ductility = "A" | "B"(기본) | "C"   (inclined 의 k = ft/fy 와 eps_uk. ec2-05-2 는 B, C 만 허용),
#  eps_ud (기본 NA 값 또는 0.9 eps_uk)
#  fcd = alpha_cc*fck/gamma_c, fyd = fy/gamma_s 로 해석하고 결과를 그대로 설계강도로 쓴다 (phi 없음).
#  변형률 평면은 pivot B (εcu2), pivot C (점 C, εc2), 경사 가지일 때 pivot A (eps_ud).
#  미반영: 최소 편심 e0, 세장 효과, 구속 효과.

# --- type = "custom" (연구용: 곡선, 기준점, phi 를 직접 지정) ----------------------
#  [code]
#  type = "custom"
#  concrete = { csv = "concrete_test.csv", beyond = ["hold", "zero"] }   # 필수. 아래 "재료 곡선" 참고
#  rebar    = { type = "elastic_plastic", E = 200000, fy = 420 }         # 철근 곡선 (철근이 있으면 필수)
#  steel    = { ... }                                                    # 형강 곡선 (형강이 있으면 필수)
#  tendon   = { ... }                                                    # 긴장재 곡선 (긴장재가 있으면 필수)
#  eps_cu = 0.003        # 극한 압축변형률. 압축 연단의 변형률로 고정된다 (기본 0.003)
#  phi = 1.0             # 강도감소계수, 상수 (기본 1.0). 축력 상한은 적용하지 않는다.
#  (phi 를 함수로 주거나 사용자 Pivot, 축력 상한이 필요하면 Python 으로 CustomCode 를 쓴다.)

# --- 재료 곡선 (custom 의 concrete/rebar/steel/tendon, 그리고 철근, 형강, 긴장재의 law 에 공통) ---
#  압축이 양(+)이다. 세 가지 형식 중 하나를 쓴다.
#   1) 점 표 :  { strain = [-0.08, -0.0023, 0.0023, 0.08], stress = [-480, -480, 480, 480] }
#   2) CSV   :  { csv = "파일.csv", delimiter = "," }     열 2개(변형률, 응력). 머리글과 # 주석 행은 건너뜀
#   3) 탄소성:  { type = "elastic_plastic", E = 200000, fy = 420 }
#  점 표와 CSV 에는 표 바깥 변형률에서의 거동 beyond 를 줄 수 있다.
#     beyond = "hold"            양쪽 모두 끝 응력 유지
#     beyond = "zero"            양쪽 모두 응력 0 (파단, 압괴)
#     beyond = ["hold", "zero"]  [인장 쪽(작은 변형률), 압축 쪽(큰 변형률)] 순서
#  점 표에는 yield_strain = 0.0021 을 줄 수 있다 (phi 계산에 쓰는 항복변형률. 없으면 설계기준 값 사용).


# ------------------------------------------------------------------------------
#  [section]  단면  (outer 필수, 나머지 선택)
# ------------------------------------------------------------------------------
[section]

# --- outer: 콘크리트 외곽선 ---------------------------------------------------
#  다각형은 아래 두 가지 중 하나로 준다. (시계, 반시계 방향 모두 가능, 자기 교차 불가)
#   (a) 꼭짓점 목록:  [[x1, y1], [x2, y2], ...]            꼭짓점이 3개 이상
#   (b) 도형 표   :  { shape = "...", ... }
#  콘크리트 도형 shape 선택지와 키 (outer, holes 공통). 길이는 모두 mm, 각도는 deg.
#     "rect"       사각형.  width, height (필수) / x=0, y=0 (좌하단) / r=0 (네 모서리 반지름) / n_arc=12 (90도당 호 분할 수)
#     "circle"     원형.    r (반지름, 필수) / cx=0, cy=0 (중심) / n=64 (다각형 꼭짓점 수) / equal_area=false (true 면 면적이 pi*r^2 가 되게 보정)
#     "track"      트랙형(스타디움: 양쪽 반원 + 직선부).  length (전체 길이), width (폭, 반원 지름) (필수, length > width)
#                  / cx=0, cy=0 (중심) / rotation_deg=0 (중심 둘레 반시계 회전) / n_arc=12
#     "t_section"  T형(플랜지가 위).  bf (플랜지 폭), h (전체 높이), tf (플랜지 두께), tw (웹 두께) (필수)
#                  / x=0, y=0 (외접 사각형의 좌하단) / rotation_deg=0 (외접 사각형 중심 둘레 회전)
#     "l_section"  L형(세로 다리 왼쪽, 가로 다리 아래).  width, height (외곽), tx (세로 다리 폭), ty (가로 다리 높이) (필수)
#                  / x=0, y=0 (외접 사각형의 좌하단) / r=0 (오목한 모서리 반지름) / rotation_deg=0 / n_arc=12
outer = { shape = "rect", x = 0, y = 0, width = 400, height = 600 }

# --- holes: 콘크리트 구멍 (여러 개 가능). 외곽선 안쪽에 완전히 들어가야 하고 서로 겹치면 안 됨 ----
# holes = [
#   { shape = "circle", cx = 200, cy = 300, r = 50 },
#   [[100, 100], [150, 100], [150, 150], [100, 150]],
# ]

# --- rebar_standard: 철근 규격표 (선택, 기본 "custom") ---------------------------
#  철근 1개의 단면적을 규격 호칭(size)으로 줄 때 어느 표를 쓸지 정한다.
#     "custom"   표를 쓰지 않는다. 단면적 area [mm^2] 또는 지름 dia [mm] 를 직접 준다 (기본)
#     "KS"       KS D 3504 이형철근:  D4 D5 D6 D7 D8 D10 D13 D16 D19 D22 D25 D29 D32 D35 D38 D41 D43 D51 D57
#                (D25 = 506.7 mm^2, 공칭지름 25.4 mm)
#     "ASTM"     ASTM A615 (인치-파운드 호칭):  #3 #4 #5 #6 #7 #8 #9 #10 #11 #14 #18   ("8" 처럼 숫자만 써도 됨)
#                (#8 = 509.7 mm^2)
#     "ASTM_SI"  ASTM A615M (미터 호칭):  #10 #13 #16 #19 #22 #25 #29 #32 #36 #43 #57
#                (#25 = 510 mm^2, #8 과 같은 철근. 규격이 mm^2 값을 직접 정해 둔 표 값)
#     "BS"       공칭 지름 [mm]:  6 8 10 12 16 20 25 32 40 50   ("T16", "H16", "B16" 처럼 써도 됨)
#                (16 = 201.1 mm^2. 6 과 50 은 규격표에서 비권장 호칭)
#  KS 는 공칭지름의 원 면적 pi/4*d^2, ASTM 은 규격의 in^2 값, ASTM_SI 는 규격의 mm^2 값, BS 는 pi/4*d^2 이다.
#  표 값은 KS D 3504 표 4, ASTM A615/A615M-12 표 1, BS 단면적 표와 대조했다.
# rebar_standard = "KS"

# --- bars: 철근 ------------------------------------------------------------------
#  항목 하나는 아래 형식 중 하나이다. 목록 안에 섞어서 써도 된다.
#   [x, y, area]                                          한 개 (area = 철근 1개 단면적 [mm^2])
#   { x = 60, y = 60, area = 507 }                        한 개 (표 형식)
#   { x = 60, y = 60, size = "D25" }                      규격 호칭으로 면적을 정함 (rebar_standard 필요)
#   { x = 60, y = 60, dia = 25.4 }                        지름 [mm] 로 면적을 정함 (pi/4*dia^2). rebar_standard 와 무관
#   { x = 60, y = 60, area = 507, law = { ... } }         이 철근만 다른 재료 곡선 (위 "재료 곡선" 형식)
#   { line = [[x1, y1], [x2, y2]], n = 4, area = 507 }    두 점 사이에 n 개를 등간격 배치 (양 끝점 포함, n=1 이면 중점)
#   { circle = [cx, cy, r], n = 12, area = 507, start_deg = 0 }   반지름 r 원 위에 n 개를 등간격 배치 (start_deg 에서 시작 [deg])
#  면적은 area, dia, size 중 정확히 하나로 준다. line 과 circle 에도 같은 키(area/dia/size)와 law 를 줄 수 있다.
#  철근은 콘크리트 안(경계 포함)에 있어야 하고 구멍, 형강 안에 있으면 안 된다.
bars = [
  { line = [[60, 60],  [340, 60]],  n = 3, area = 507 },     # 아래쪽 3개
  { line = [[60, 540], [340, 540]], n = 3, area = 507 },     # 위쪽 3개
  [60, 300, 507],                                            # 좌측 중간
  [340, 300, 507],                                           # 우측 중간
]

# --- steel: 매입 형강 (여러 개 가능, [[section.steel]] 로 하나씩 씀) ---------------
#  [[section.steel]]
#  polygon = { shape = "h_section", d = 300, bf = 200, tw = 10, tf = 16, cx = 200, cy = 300 }
#  철골 도형 shape 선택지와 키 (polygon 에만 쓴다. 꼭짓점 목록 [[x, y], ...] 도 가능):
#     "h_section"    H형.  d (전체 높이), bf (플랜지 폭), tw (웹 두께), tf (플랜지 두께) (필수)
#                    / cx=0, cy=0 (중심) / rotation_deg=0 (반시계 회전) / r=0 (웹-플랜지 모깎기) / n_arc=8
#     "hollow_rect"  중공 사각형(박스).  width, height (외곽), t (벽 두께) (필수, 2t < 짧은 변)
#                    / cx=0, cy=0 (중심) / rotation_deg=0.  속 빈 부분은 자동으로 구멍이 된다.
#  holes   = [ ... ]                         # 선택. 추가로 낼 형강 내부 구멍 (콘크리트 도형 또는 꼭짓점 목록)
#  law     = { type = "elastic_plastic", E = 200000, fy = 355 }   # 선택. 없으면 code 의 Fy 로 만든 탄소성 곡선

# --- tendons: 긴장재 (bars 와 같은 형식 + 프리스트레스 키) -------------------------
#  area : 긴장재 1개 단면적 [mm^2]
#  fse  : 유효 프리스트레스 [MPa], 인장이 양수로 입력 (기본 0)
#  eps_pe : fse 대신 프리스트레인(인장 변형률)을 직접 줄 때 (fse 보다 우선)
#  duct_area : 덕트 단면적 Apd [mm^2] (선택). 콘크리트에서 이 면적만큼 뺀다. 없으면 area 와 같다(Apd = Apt).
#              덕트가 없는 프리텐션은 0 을 입력한다 (ACI 22.4.2.3 의 Apd)
#  law  : 이 긴장재만 다른 곡선
# tendons = [
#   { circle = [200, 300, 150], n = 8, area = 98.7, fse = 1000 },
#   { x = 100, y = 100, area = 98.7, fse = 1000 },
# ]


# ------------------------------------------------------------------------------
#  [analysis]  해석 옵션  (전부 선택)
# ------------------------------------------------------------------------------
#  [loads] 가 있으면 곡선은 각 하중의 모멘트 방향으로 자동 계산되므로 lambda_u_deg 는 필요 없다.
#  [loads] 가 없으면 lambda_u_deg 를 줘야 하고, 그 방향의 곡선만 계산한다.
[analysis]
# lambda_u_deg = 30      # 모멘트 방향 atan2(Muy, Mux) [deg]
n_c = 80                 # 중립축 깊이 c 의 개수. 2 이상의 정수 (기본 80)
# c_min_ratio = 0.02     # 가장 얕은 c 의 크기 (단면 외접 대각선 D 의 배수)   (기본 0.02)
# c_max_ratio = 10.0     # 가장 깊은 c 의 크기 (D 의 배수). c_min_ratio 보다 커야 함 (기본 10)
reference = "geometric"  # 모멘트 기준점. 입력하는 Mux, Muy 도 같은 점에 대한 값이어야 한다.
                         #   "geometric" : 콘크리트 총단면(구멍 제외)의 도심 (기본). 철근, 형강은 포함하지 않음
                         #   "plastic"   : 소성 중심 (철근, 형강, 긴장재가 순압축 때 내는 힘의 합력점)
                         #   [x, y]      : 임의 좌표 [mm]  예) reference = [200, 300]
# tol_deg = 1e-6         # λn = λu 를 맞추는 각도 허용오차 [deg]   (기본 1e-6)
# scan_deg = 5.0         # 해를 못 찾을 때 전 구간 탐색 간격 [deg]  (기본 5)
# full_scan = false      # true 면 매번 0~360도를 전부 탐색 (느림, 검증용)


# ------------------------------------------------------------------------------
#  [loads.이름]  하중  (선택, 여러 개 가능)  -  단위 kN, kN*m
# ------------------------------------------------------------------------------
#  표 이름이 그대로 출력 파일 이름에 쓰인다 (<basename>_<이름>.png/.csv).
#  하중마다 DCR(요구/용량 비)을 구한다. DCR <= 1 이면 OK.
#  키:  Pu  = 소요 축력 [kN], 압축이 양(+)
#       Mux = x축 둘레 모멘트 [kN*m]
#       Muy = y축 둘레 모멘트 [kN*m]
[loads.L1]
Pu = 1800
Mux = 250
Muy = 145

# [loads.L2]
# Pu = 800
# Mux = -150
# Muy = 90


# ------------------------------------------------------------------------------
#  [output]  출력  (선택)
# ------------------------------------------------------------------------------
#  결과 폴더 기본값:  out/<이 파일의 이름>/   예) out/rect_aci318-25/   (실행한 폴더 기준, 없으면 만듦)
#  명령줄 --out 폴더 를 주면 그 폴더에 저장한다.
[output]
# dir = "결과/폴더"              # 선택. 기본 폴더 대신 쓸 위치. 상대 경로는 이 파일 위치 기준
basename = "rect_aci318-25"        # 파일 이름 앞부분 (기본: 이 파일의 이름)
                                 # 하중이 있으면 rect_aci318-25_L1.png/.csv, 없으면 rect_aci318-25.png/.csv
